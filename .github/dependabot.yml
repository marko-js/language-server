version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # Matches `engines.vscode` in packages/vscode, so the extension cannot
      # type-check against APIs its oldest supported VS Code lacks; raise
      # both together.
      - dependency-name: "@types/vscode"
