packages:
  - packages/*
  # A language-server fixture of templates on Marko 6, which the repo's own
  # `marko` (5) does not type.
  - packages/language-server/src/__tests__/fixtures/script/template-consumers-marko-6

allowBuilds:
  "@vscode/vsce-sign": true
  esbuild: true

linkWorkspacePackages: true

# `marko`'s generated type imports reference `@marko/runtime-tags` from user
# code without it being a direct dependency; hoist it like npm did so
# TypeScript can resolve those imports in tests.
publicHoistPattern:
  - "@marko/runtime-tags"

# This repo depends on same-day marko releases; disable pnpm's release-age gate.
minimumReleaseAge: 0

patchedDependencies:
  jsdom@31.0.0: patches/jsdom@31.0.0.patch
